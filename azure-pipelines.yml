# Azure Pipelines for Utilities.Billing.Api using the shared platform-deploy template

trigger:
- develop
- master

resources:
  repositories:
  - repository: self
  - repository: platform_deploy
    type: github
    endpoint: iotzyco
    name: iotzyco/platform-deploy
    ref: main

extends:
  template: /pipelines/templates/backend-service.yml@platform_deploy
  parameters:
    devNamespace: 'umec-dev'
    prodNamespace: 'umec-production'
    serviceName: 'utilities-billing'
    dockerfile: 'Utilities.Billing.Api/Dockerfile'